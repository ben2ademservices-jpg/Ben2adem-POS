<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Ben2adem Verification</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#061a37,#0c3d77);min-height:100vh;display:grid;place-items:center}.card{background:#fff;width:min(500px,92vw);padding:38px;border-radius:20px;text-align:center}h1{font-size:36px;margin:0;color:#071a35}.b{color:#1877e8}h2{margin:12px}.hint{color:#667085}.code{width:100%;padding:18px;font-size:36px;letter-spacing:12px;text-align:center;border:3px solid #1f6fe5;border-radius:14px}button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:12px;background:#1f6fe5;color:#fff;font-size:18px;font-weight:800}.back{background:#eef2f6;color:#1d2939}.msg{font-weight:700;color:#c62828;min-height:25px;margin-top:10px}.build{margin-top:12px;font-size:12px;color:#98a2b3}</style><script>

(()=>{const API="https://hzmujxcgeqyvgiqxzrkb.supabase.co/functions/v1/ben2adem-api";const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{let u=typeof input==='string'?input:input.url;if(u.startsWith('/api/')){u=API+u.slice(4);return nativeFetch(u,init)}return nativeFetch(input,init)};})();

</head><body><div class="card"><div style="text-align:right"><button type="button" id="langBtn" style="width:auto;padding:8px 12px;margin:0;background:#eef2f6;color:#1d2939">العربية</button></div><h1>Ben<span class="b">2</span>adem</h1><h2>Email Verification</h2><p class="hint" id="hint">Enter the 6-digit code sent to your email.</p><input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button id="verify">Verify & Open POS</button><button class="back" onclick="location.replace('/employee-login')">← Back to Login</button><div id="msg" class="msg"></div><div class="build">FINAL BUILD: OTP PAGE V9</div></div><script>const U=sessionStorage.getItem('pendingEmployeeUsername')||'',EM=sessionStorage.getItem('pendingEmployeeEmail')||'your email',C=document.getElementById('code'),M=document.getElementById('msg'),B=document.getElementById('verify');document.getElementById('hint').textContent='Code sent to '+EM+'. Enter it below.';C.oninput=()=>C.value=C.value.replace(/\D/g,'').slice(0,6);async function verify(){if(!U){M.textContent='Login again first.';return}if(!/^\d{6}$/.test(C.value)){M.textContent='Enter the 6-digit code.';return}B.disabled=true;try{const r=await fetch('/api/auth/verify-login-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:U,code:C.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Verification failed');sessionStorage.setItem('ben2adem_logged_in','1');sessionStorage.setItem('ben2adem_role','employee');sessionStorage.setItem('ben2adem_login_user',j.name||U);sessionStorage.setItem('ben2adem_token',j.token||'');sessionStorage.removeItem('pendingEmployeeUsername');sessionStorage.removeItem('pendingEmployeeEmail');location.replace('index.html?verified=1&b=FINAL-20260922')}catch(e){M.textContent=e.message;B.disabled=false;C.select()}}B.onclick=verify;C.onkeydown=e=>{if(e.key==='Enter')verify()};setTimeout(()=>C.focus(),100);</script><script>(function(){const b=document.getElementById('langBtn');if(!b)return;function apply(){const ar=localStorage.getItem('ben2adem_language_v1')==='ar';document.documentElement.dir=ar?'rtl':'ltr';b.textContent=ar?'English':'العربية';const R={
'Employee Login':'تسجيل دخول الموظف','Enter your email and password. A 6-digit code will be sent to your email.':'أدخل البريد الإلكتروني وكلمة المرور. سيتم إرسال رمز من 6 أرقام إلى بريدك.','Employee Email':'بريد الموظف الإلكتروني','Password':'كلمة المرور','Login & Send Code':'تسجيل الدخول وإرسال الرمز','← Back':'رجوع →','Email Verification':'التحقق من البريد الإلكتروني','Enter the 6-digit code sent to your email.':'أدخل الرمز المكوّن من 6 أرقام المرسل إلى بريدك الإلكتروني.','Verify & Open POS':'تحقق وافتح الكاشير','Cancel / Back':'إلغاء / رجوع'};
 document.querySelectorAll('h2,p,button').forEach(e=>{if(e===b)return;if(!e.dataset.en)e.dataset.en=e.textContent.trim();e.textContent=ar?(R[e.dataset.en]||e.dataset.en):e.dataset.en});document.querySelectorAll('input').forEach(e=>{if(!e.dataset.enph)e.dataset.enph=e.placeholder||'';e.placeholder=ar?(R[e.dataset.enph]||e.dataset.enph):e.dataset.enph})}b.onclick=()=>{localStorage.setItem('ben2adem_language_v1',localStorage.getItem('ben2adem_language_v1')==='ar'?'en':'ar');apply()};apply()})();</script></body></html>
