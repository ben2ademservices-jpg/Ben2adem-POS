<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Ben2adem Employee Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#061a37,#0c3d77);min-height:100vh;display:grid;place-items:center}.card{background:#fff;width:min(470px,92vw);padding:34px;border-radius:20px;text-align:center}h1{font-size:36px;margin:0;color:#071a35}.b{color:#1877e8}h2{margin:12px}.hint{color:#667085}input,button{width:100%;padding:16px;margin:8px 0;border-radius:12px;font-size:18px}input{border:2px solid #d0d5dd}button{border:0;background:#1f6fe5;color:#fff;font-weight:800;cursor:pointer}.back{background:#eef2f6;color:#1d2939}.msg{font-weight:700;color:#c62828;min-height:25px}.build{margin-top:12px;font-size:12px;color:#98a2b3}</style><script>
/* BEN2ADEM ONLINE API BRIDGE */
(()=>{const API="https://hzmujxcgeqyvgiqxzrkb.supabase.co/functions/v1/ben2adem-api";const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{let u=typeof input==='string'?input:input.url;if(u.startsWith('/api/')){u=API+u.slice(4);return nativeFetch(u,init)}return nativeFetch(input,init)};})();
</script>
</head><body><div class="card"><div style="text-align:right"><button type="button" id="langBtn" style="width:auto;padding:8px 12px;margin:0;background:#eef2f6;color:#1d2939">العربية</button></div><h1>Ben<span class="b">2</span>adem</h1><h2>Employee Login</h2><p class="hint">Enter your <b>email</b> and password. A 6-digit code will be sent to your email.</p><input id="email" type="email" autocomplete="off" placeholder="Employee Email"><input id="password" type="password" autocomplete="new-password" placeholder="Password"><button id="go">Login & Send Code</button><button class="back" onclick="location.replace('/')">← Back</button><div id="msg" class="msg"></div><div class="build">FINAL BUILD: EMAIL → CODE PAGE</div></div><script>const E=document.getElementById('email'),P=document.getElementById('password'),M=document.getElementById('msg'),B=document.getElementById('go');async function login(){const email=E.value.trim().toLowerCase(),password=P.value;if(!email||!password){M.textContent='Enter email and password.';return}B.disabled=true;M.textContent='Sending code...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:email,password,role:'employee'})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');if(!j.requiresOtp)throw Error('Code was not requested.');sessionStorage.setItem('pendingEmployeeUsername',j.username);sessionStorage.setItem('pendingEmployeeEmail',j.maskedEmail||email);E.value='';P.value='';location.replace('employee-verify.html?b=FINAL-20260922')}catch(e){M.textContent=e.message;B.disabled=false;P.value=''}}B.onclick=login;P.onkeydown=e=>{if(e.key==='Enter')login()};E.value='';P.value='';</script><script>(function(){const b=document.getElementById('langBtn');if(!b)return;function apply(){const ar=localStorage.getItem('ben2adem_language_v1')==='ar';document.documentElement.dir=ar?'rtl':'ltr';b.textContent=ar?'English':'العربية';const R={
'Employee Login':'تسجيل دخول الموظف','Enter your email and password. A 6-digit code will be sent to your email.':'أدخل البريد الإلكتروني وكلمة المرور. سيتم إرسال رمز من 6 أرقام إلى بريدك.','Employee Email':'بريد الموظف الإلكتروني','Password':'كلمة المرور','Login & Send Code':'تسجيل الدخول وإرسال الرمز','← Back':'رجوع →','Email Verification':'التحقق من البريد الإلكتروني','Enter the 6-digit code sent to your email.':'أدخل الرمز المكوّن من 6 أرقام المرسل إلى بريدك الإلكتروني.','Verify & Open POS':'تحقق وافتح الكاشير','Cancel / Back':'إلغاء / رجوع'};
 document.querySelectorAll('h2,p,button').forEach(e=>{if(e===b)return;if(!e.dataset.en)e.dataset.en=e.textContent.trim();e.textContent=ar?(R[e.dataset.en]||e.dataset.en):e.dataset.en});document.querySelectorAll('input').forEach(e=>{if(!e.dataset.enph)e.dataset.enph=e.placeholder||'';e.placeholder=ar?(R[e.dataset.enph]||e.dataset.enph):e.dataset.enph})}b.onclick=()=>{localStorage.setItem('ben2adem_language_v1',localStorage.getItem('ben2adem_language_v1')==='ar'?'en':'ar');apply()};apply()})();</script></body></html>
